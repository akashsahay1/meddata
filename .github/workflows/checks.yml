name: Checks

# Backend tests, and flutter analyze + flutter test for the app, on every
# push and pull request.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, zip, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run the tests
        run: php artisan test

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Get packages
        run: flutter pub get

      # Issues and failed tests are also posted as annotations on the run.
      - name: Analyze
        run: |
          set +e
          flutter analyze --format=machine > analyze.txt 2>&1
          status=$?
          cat analyze.txt
          python3 ../.github/scripts/annotate_analyze.py analyze.txt
          exit $status

      - name: Run the tests
        run: |
          set +e
          flutter test --reporter json > test-results.json
          status=$?
          python3 ../.github/scripts/annotate_tests.py test-results.json
          exit $status
