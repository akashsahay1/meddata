name: Windows installer

# Builds Medikabiz-Setup-<version>.exe on GitHub's Windows machine after
# every push to main (download it from the run's Artifacts), or by hand from
# the Actions tab. Pushing a tag like v1.0.1 also attaches the installer to a
# GitHub release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # Windows Server 2025: Visual Studio 2026 with the C++ ATL component, Inno Setup 6.
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write # only used to attach the installer to a release
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = [regex]::Match((Get-Content app/pubspec.yaml -Raw), '(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Groups[1].Value
          if ("v$version" -ne $env:TAG) {
            throw "Tag $env:TAG does not match version $version in app/pubspec.yaml. Change one of them."
          }

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Build the app and the installer
        shell: pwsh
        run: ./app/tool/build_windows_installer.ps1

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: Medikabiz-Setup
          path: app/build/installer/Medikabiz-Setup-*.exe
          if-no-files-found: error

      - name: Attach the installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/installer/Medikabiz-Setup-*.exe
