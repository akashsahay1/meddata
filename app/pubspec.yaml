name: med_stock
description: "Medicine Stock & Expiry Tracker — offline-first pharmacy inventory."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (lightweight, old-phone friendly).
  provider: ^6.1.2

  # Local database (offline source of truth).
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # Utilities.
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.5

  # Notifications & background checks.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  workmanager: ^0.9.0+3

  # Billing (subscriptions).
  in_app_purchase: ^3.2.0

  # Enhancements.
  mobile_scanner: ^5.2.3
  csv: ^6.0.0
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^10.1.4
  file_selector: ^1.0.3

  # Backend communication (Laravel API).
  http: ^1.2.2

  # Runtime permissions (camera for barcode scan).
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# App launcher icon (monochrome B&W logo).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/meddata_logo.png"
  min_sdk_android: 23
  remove_alpha_ios: true
  # Android adaptive icon: white background (B&W theme), logo as foreground.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/meddata_logo.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
