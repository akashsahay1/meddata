name: medikabiz
description: "Medikabiz - A medicine Stock & Expiry Tracker — offline-first pharmacy inventory."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (lightweight, old-phone friendly).
  provider: ^6.1.2

  # Local database (offline source of truth).
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # Utilities.
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.5

  # Notifications & background checks.
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  # Payments (Razorpay — replaces Google Play Billing per requirements).
  # Enhancements.
  mobile_scanner: ^7.2.0
  csv: ^8.0.0
  # Reading .xlsx for the stock import wizard (pure Dart; both already come
  # with `pdf`).
  archive: ^4.0.2
  xml: ^7.0.1
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^13.2.0
  file_selector: ^1.0.3

  # Backend communication (Laravel API).
  http: ^1.2.2

  # Runtime permissions (camera for barcode scan).
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.2
  app_settings: ^9.0.0
  image_picker: ^1.2.3
  # Shrinks photos before upload (the Windows picker ignores maxWidth).
  image: ^4.10.1
  sqflite_common_ffi: ^2.4.3
  # Auth token storage (Keychain / Android Keystore / Windows Credential
  # Manager). The Windows build needs Visual Studio's "C++ ATL" component.
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.8

# App launcher icon (Medikabiz "M" mark, from the brand pack).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 23
  remove_alpha_ios: true
  # Android adaptive icon: the M (already inside the safe zone) on the brand's
  # light background.
  adaptive_icon_background: "#F5FBFF"
  adaptive_icon_foreground: "assets/images/launcher_foreground.png"
  adaptive_icon_foreground_inset: 0
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/logo.png"

# Native splash screen (Medikabiz dark blue with the app icon).
flutter_native_splash:
  color: "#071D3B"
  image: assets/images/splash.png
  # Android 12+ masks the splash icon to a circle (MIUI crops a square), so it
  # gets the M scaled into the safe zone on the brand's light icon background.
  android_12:
    color: "#071D3B"
    image: assets/images/splash_android12.png
    icon_background_color: "#F5FBFF"
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # Static Regular/Bold subsets of GoogleSansFlex (OFL) for invoice PDFs:
    # the PDF can't use the variable font's weights, and they carry the ₹ glyph.
    - assets/fonts/pdf/

  fonts:
    # As on medikabiz.com (SIL Open Font License, see assets/fonts/OFL-*.txt).
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Variable.ttf
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Variable.ttf
