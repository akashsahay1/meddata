org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Built-in Kotlin: with AGP 9+ the Android plugin compiles Kotlin itself. The
# Flutter migration template set this to false, which makes plugins such as
# mobile_scanner fall back to applying the Kotlin Gradle Plugin — the exact
# thing Flutter warns will stop working in a future release. Enabling it keeps
# the build forward-compatible. Note it does NOT silence Flutter's KGP warning:
# that check regex-scans the plugin's build.gradle text, so it still matches the
# (now unreachable) `apply plugin: 'kotlin-android'` line inside mobile_scanner.
android.builtInKotlin=true
# Disable Kotlin incremental compilation: plugin sources live in the pub cache on
# C:\ while this project builds on E:\, and Kotlin's incremental cache cannot
# relativize paths across Windows drives (IllegalArgumentException: different roots).
kotlin.incremental=false
